name: Build Rescue USB image

on:
  push:
    branches: [main]
    paths: ["agent/**", "liveos/**", ".github/workflows/build-iso.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build the ISO in a Debian 13 container
        run: |
          docker run --rm --privileged -v "$PWD:/work" -w /work debian:trixie sh -c '
            set -e
            apt-get update
            apt-get install -y live-build
            grep -rn "timeout" /usr/share/live/build/bootloaders/ || true
            sh liveos/build.sh
          '

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: rescue-ai-iso
          path: |
            liveos/rescue-ai-amd64.iso
            liveos/rescue-ai-amd64.iso.sha256
          compression-level: 0
          retention-days: 14

  # Boot the new ISO in a virtual machine (UEFI, internet, no Windows disk) and photograph its screen.
  boot-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rescue-ai-iso

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          cat > boot.sh <<'EOF'
          #!/bin/bash
          # boot.sh NAME SECONDS [qemu options]: boot the ISO, screenshot every minute, then screens 2 and 1
          name=$1; secs=$2; shift 2
          accel=tcg; [ -w /dev/kvm ] && accel=kvm
          echo "$name: acceleration $accel"
          cp /usr/share/OVMF/OVMF_VARS_4M.fd "vars-$name.fd"
          mkdir -p shots
          qemu-system-x86_64 -machine q35,accel=$accel -m 3072 -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file="vars-$name.fd" \
            -cdrom rescue-ai-amd64.iso -nic user,model=e1000 -display none \
            -monitor unix:"mon-$name.sock",server,nowait "$@" &
          pid=$!
          mon() { python3 -c "import socket, sys, time; s = socket.socket(socket.AF_UNIX); s.connect(sys.argv[1]); s.sendall((sys.argv[2] + '\n').encode()); time.sleep(2)" "mon-$name.sock" "$1"; }
          for t in $(seq 60 60 "$secs"); do
            sleep 60
            mon "screendump shots/$name-${t}s.png -f png"
          done
          mon "sendkey ctrl-alt-f2"; sleep 5; mon "screendump shots/$name-tty2.png -f png"
          mon "sendkey ctrl-alt-f1"; sleep 5; mon "screendump shots/$name-tty1.png -f png"
          kill $pid; wait $pid 2>/dev/null; true
          EOF
          chmod +x boot.sh

      - name: Boot like a PC (UEFI boot menu) and take screenshots
        run: ./boot.sh menu 300 -vga virtio

      - name: Boot again with a log of the whole start-up (every service message)
        run: |
          mkdir iso && sudo mount -o loop,ro rescue-ai-amd64.iso iso
          cp iso/live/vmlinuz iso/live/initrd.img . && sudo umount iso
          ./boot.sh serial 300 -vga virtio -kernel vmlinuz -initrd initrd.img -serial file:serial.log \
            -append "boot=live components nomodeset hostname=rescue-ai console=tty1 console=ttyS0,115200 systemd.journald.forward_to_console=1"
          mv serial.log shots/

      - name: Upload the screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-screens
          path: shots/
          retention-days: 14
